server:
  port: 8010

jwt:
  secret-key: ekh32837389owhjeg3782rdshqjvg32975d37286763ry237652ryedgf6

app:
  security:
    trust-inbound-headers: false
    public-routes:
      - "/v1/auth/**"
      - "/webhook/**"
      - "/actuator/**"

  rate-limit:
    method: fixed
    use-case:
      api-keys:
        requests-per-minute: 200

spring:
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: merchant-service
              uri: ${MERCHANT_SERVICE_URI:lb://merchant-service}
              predicates:
                - Path=/v1/auth/**, /v1/merchants/**

            - id: payment-service
              uri: ${PAYMENT_SERVICE_URI:lb://payment-service}
              predicates:
                - Path=/v1/orders/**, /v1/payments/**

            - id: vault-service
              uri: ${VAULT_SERVICE_URI:lb://vault-service}
              predicates:
                - Path=/v1/vault/**

            - id: operation-service
              uri: ${OPERATIONS_SERVICE_URI:lb://operation-service}
              predicates:
                - Path=/webhook/**

      

---

spring:
  config:
    activate:
      on-profile: k8s

jwt:
  secret-key: ${JWT_SECRET}
  
